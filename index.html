<!DOCTYPE html>
<html>
<head>
    <title>Australian Bushfire Dashboard</title>
    <!-- These are the Vega-Lite libraries -->
    <script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-lite@5"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>
</head>
<body>

<!-- This single div is where the entire dashboard will be embedded -->
<div id="vis"></div>

<script>
    // This tells vegaEmbed to load your new dashboard definition into the 'vis' div
    vegaEmbed('#vis', 'dashboard.vl.json');
</script>

</body>
</html>
